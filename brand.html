<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brand Atelier — ROOTED</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-progress"><span style="width:52%"></span></div>

  <nav class="rooted-nav">
    <a class="nav-brand" href="index.html">
      <span class="root-symbol">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9">
          <circle cx="50" cy="50" r="43"/>
          <path d="M50 8v84M50 50 25 75M50 65 32 83M50 50l25 25M50 65l18 18"/>
        </svg>
      </span>
      ROOTED
    </a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="dashboard.html">Discover</a>
      <a class="nav-link" href="orders.html">Orders</a>
    </div>
    <div class="nav-actions">
      <a class="nav-action" href="wishlist.html">♡<span class="nav-badge" data-wish-count>0</span></a>
      <a class="nav-action" href="cart.html">⌂<span class="nav-badge" data-cart-count>0</span></a>
    </div>
  </nav>

  <main class="product-page">
    <section class="section" style="padding-top:20px">
      <div class="container">
        <div id="brandHead" class="brand-mast"></div>
        <div class="stat-row">
          <div class="stat"><span>ROOTED Partner</span><b>Active</b></div>
          <div class="stat"><span>Provenance</span><b id="statLocation">—</b></div>
          <div class="stat"><span>Current Pieces</span><b id="statPieces">—</b></div>
          <div class="stat"><span>Fulfillment</span><b>Managed</b></div>
        </div>
      </div>
    </section>

    <section class="section" id="collection" style="padding-top:25px">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">CURRENT COLLECTION</div>
            <h2>In rotation.</h2>
          </div>
          <div class="filters">
            <button class="filter active" data-cat="All">All</button>
            <button class="filter" data-cat="Jackets">Jackets</button>
            <button class="filter" data-cat="Hoodies">Hoodies</button>
            <button class="filter" data-cat="Shirts">Shirts</button>
            <button class="filter" data-cat="Pants">Pants</button>
          </div>
        </div>
        <div id="brandProducts" class="product-grid"></div>
      </div>
    </section>

    <section class="section" style="background:var(--paper-2)">
      <div class="container">
        <div class="brand-story">
          <img id="founderImg" src="" alt="Founder">
          <div class="story-body">
            <div class="eyebrow">THE MAKER'S ORIGIN</div>
            <h2 id="storyTitle">The hands behind the label.</h2>
            <p id="storyBio"></p>
            <p id="storyQuote" style="font-family:var(--serif);font-size:18px;color:var(--clay);margin-top:10px"></p>
            <div style="margin-top:20px">
              <a class="btn" href="dashboard.html">Explore other local makers →</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span data-year></span> ROOTED South Africa</span>
        <span>Made visible through ROOTED.</span>
      </div>
    </div>
  </footer>

  <div class="toast"></div>

  <script src="app.js"></script>
  <script>
    let b, cat = "All";

    function paint() {
      let list = ROOTED.products.filter(p => p.brandId === b.id && (cat === "All" || p.category === cat));
      renderProducts(list, document.getElementById("brandProducts"));
    }

    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("brand") || "bokkie";
      b = brand(id) || ROOTED.brands[0];
      document.title = b.name + " — ROOTED";

      document.getElementById("brandHead").innerHTML = `
        <div class="brand-avatar" style="background:${b.className === 'clay' ? 'var(--clay)' : b.className === 'moss' ? 'var(--moss)' : b.className === 'gold' ? 'var(--gold)' : 'var(--teal)'}">${b.initials}</div>
        <div>
          <div class="brand-location">${b.location}</div>
          <h1>${b.name}</h1>
          <p>${b.bio}</p>
        </div>
        <div class="brand-actions">
          <button class="btn ghost" onclick="toast('Brand following connected to your ROOTED account.')">＋ Follow</button>
          <a class="btn" href="#collection">Shop label →</a>
        </div>
      `;

      document.getElementById("statLocation").textContent = b.location.split("·")[1]?.trim() || b.location;
      document.getElementById("statPieces").textContent = ROOTED.products.filter(p => p.brandId === b.id).length;
      document.getElementById("storyTitle").textContent = b.founder + " — " + b.name;
      document.getElementById("storyBio").textContent = b.story + " " + b.bio;
      document.getElementById("storyQuote").textContent = "“" + b.quote + "”";

      document.getElementById("founderImg").src = b.id === "bokkie"
        ? "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&auto=format&fit=crop&q=85"
        : b.id === "nkosi"
        ? "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800&auto=format&fit=crop&q=85"
        : b.id === "jacaranda"
        ? "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=800&auto=format&fit=crop&q=85"
        : "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&auto=format&fit=crop&q=85";

      document.querySelectorAll(".filter").forEach(x => x.onclick = () => {
        cat = x.dataset.cat;
        document.querySelectorAll(".filter").forEach(y => y.classList.remove("active"));
        x.classList.add("active");
        paint();
      });

      paint();
      setProgress(52);
    });
  </script>
</body>
</html>
