<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Bag — ROOTED</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-progress"><span style="width:80%"></span></div>

  <nav class="rooted-nav">
    <a class="nav-brand" href="index.html">
      <span class="root-symbol">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9">
          <circle cx="50" cy="50" r="43"/>
          <path d="M50 8v84M50 50 25 75M50 65 32 83M50 50l25 25M50 65l18 18"/>
        </svg>
      </span>
      ROOTED
    </a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="dashboard.html">Discover</a>
      <a class="nav-link" href="orders.html">Orders</a>
    </div>
    <div class="nav-actions">
      <a class="nav-action" href="wishlist.html">♡<span class="nav-badge" data-wish-count>0</span></a>
      <a class="nav-action active" href="cart.html">⌂<span class="nav-badge" data-cart-count>0</span></a>
    </div>
  </nav>

  <header class="page-hero">
    <div class="container">
      <div class="eyebrow">YOUR ROOTED BAG</div>
      <h1>Everything you found.</h1>
      <p class="lede">Review your pieces, mix multiple local brands, and let ROOTED handle consolidated fulfillment.</p>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div id="cartArea" class="cart-layout"></div>
    </div>
  </main>

  <section class="section" style="background:var(--paper-2)">
    <div class="container">
      <div class="section-head">
        <div>
          <div class="eyebrow">STILL CURIOUS?</div>
          <h2>More from the collective.</h2>
        </div>
      </div>
      <div id="suggested" class="product-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span data-year></span> ROOTED South Africa</span>
        <span>Discover local. Wear local.</span>
      </div>
    </div>
  </footer>

  <div class="toast"></div>

  <script src="app.js"></script>
  <script>
    let promoDiscount = 0;

    function drawCart() {
      const c = getCart();
      const area = document.getElementById("cartArea");
      if (!c.length) {
        area.innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <div class="eyebrow" style="justify-content:center">YOUR BAG IS QUIET</div>
            <h2>No pieces in your bag yet.</h2>
            <p class="lede" style="margin:10px auto 20px">Explore independent South African labels and bring something home.</p>
            <a class="btn" href="dashboard.html">Discover local pieces →</a>
          </div>
        `;
        return;
      }

      let sub = 0;
      let activeItems = 0;

      const cards = c.map((x, i) => {
        const p = product(x.id);
        if (!p) return "";
        const isSelected = x.selected !== false;
        if (isSelected) {
          sub += p.price * x.qty;
          activeItems += x.qty;
        }
        return `
          <div class="cart-card ${isSelected ? '' : 'disabled'}">
            <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${i})" aria-label="Select ${p.name}">
            <div class="cart-thumb">
              <img src="${p.img}" alt="${p.name}">
            </div>
            <div class="cart-meta">
              <h3>${p.name}</h3>
              <small>${p.brand}</small>
              <p>Size: ${x.size} · Color: ${x.color}</p>
              <div class="cart-controls">
                <div class="mini-qty">
                  <button onclick="change(${i}, -1)">−</button>
                  <span>${x.qty}</span>
                  <button onclick="change(${i}, 1)">+</button>
                </div>
                <button class="remove" onclick="removeCart(${i})">Remove</button>
              </div>
            </div>
            <div class="cart-price">${money(p.price * x.qty)}</div>
          </div>
        `;
      }).join("");

      const discountAmt = Math.round(sub * promoDiscount);
      const discountedSub = Math.max(0, sub - discountAmt);
      const shipping = (discountedSub >= 1500 || activeItems === 0) ? 0 : 120;
      const total = discountedSub + shipping;

      area.innerHTML = `
        <div>
          ${cards}
          <a class="btn ghost" href="dashboard.html" style="margin-top:14px">← Continue discovering</a>
        </div>
        <aside class="summary">
          <h3>Order summary</h3>
          <div class="sum-row">
            <span>Selected Items (${activeItems})</span>
            <span>${money(sub)}</span>
          </div>
          ${promoDiscount > 0 ? `
          <div class="sum-row" style="color:var(--clay)">
            <span>ROOTED10 Promo (10%)</span>
            <span>-${money(discountAmt)}</span>
          </div>` : ''}
          <div class="sum-row">
            <span>Consolidated Courier</span>
            <span>${shipping ? money(shipping) : (activeItems ? 'Complimentary' : 'R 0')}</span>
          </div>
          <div class="promo">
            <input id="promo" placeholder="Promo code (e.g. ROOTED10)">
            <button class="btn small" onclick="applyPromo()">Apply</button>
          </div>
          <div class="sum-row sum-total">
            <span>Total</span>
            <span>${money(total)}</span>
          </div>
          <a class="btn clay" style="width:100%;margin-top:14px" href="${activeItems ? 'checkout.html' : '#'}" onclick="${activeItems ? '' : "event.preventDefault();toast('Please select at least one item before checkout.')"}">
            Continue to checkout →
          </a>
          <div class="secure-note">
            ✓ Multi-brand consolidation<br>
            ✓ Tracked nationwide delivery<br>
            ✓ Direct revenue allocation to makers
          </div>
        </aside>
      `;
    }

    function toggleSelect(i) {
      const c = getCart();
      c[i].selected = c[i].selected === false ? true : false;
      setCart(c);
      drawCart();
    }

    function change(i, d) {
      const c = getCart();
      c[i].qty = Math.max(1, c[i].qty + d);
      setCart(c);
      drawCart();
    }

    function removeCart(i) {
      const c = getCart();
      c.splice(i, 1);
      setCart(c);
      toast("Piece removed from your bag.");
      drawCart();
    }

    function applyPromo() {
      const v = document.getElementById("promo").value.trim().toUpperCase();
      if (v === "ROOTED10") {
        promoDiscount = 0.10;
        toast("ROOTED10 applied — 10% demo discount active.");
      } else {
        promoDiscount = 0;
        toast("Use code ROOTED10 for the 10% demo discount.");
      }
      drawCart();
    }

    document.addEventListener("DOMContentLoaded", () => {
      drawCart();
      renderProducts(ROOTED.products.filter(p => !getCart().some(x => x.id === p.id)).slice(0, 4), document.getElementById("suggested"));
      setProgress(80);
    });
  </script>
</body>
</html>
